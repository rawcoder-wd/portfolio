name: CI Pipeline

on:
     push:
          branches: [master]
     pull_request:
          branches: [master]

jobs:
     test-and-build:
          runs-on: ubuntu-latest
          steps:
               - name: Checkout code
                 uses: actions/checkout@v4

               - name: Set up Go
                 uses: actions/setup-go@v5
                 with:
                      go-version: "1.23"

               - name: Run Go Backend Tests
                 working-directory: ./backend
                 run: go test -v ./...

               - name: Set up Node.js
                 uses: actions/setup-node@v4
                 with:
                      node-version: "20"
                      cache: "npm"
                      cache-dependency-path: ./frontend/package-lock.json

               - name: Install & Build React Frontend
                 working-directory: ./frontend
                 run: |
                      npm ci
                      npm run build
